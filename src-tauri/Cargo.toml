[package]
name = "tos-checker"
version = "0.1.0"
description = "Flags the parts of a terms of service that people should know about before they click accept."
edition = "2021"

[lib]
# The `_lib` suffix keeps the library from clashing with the `tos-checker`
# binary on Windows (cargo issue #8519).
name = "tos_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
